    <template id="greetings">

Use "help" to see a list of available commands
    </template>
    <script>


//This function counts the decimal places of the input number
//It does NOT count total digits, just the amount after the decimal point, ex. countDecimalPlaces(1.23) = 2
function countDecimalPlaces(num) {
    //first, convert the number into a string
    const numStr = num.toString();
    //if the string has a decimal point, split the string, grab the second element, (which is everything after the decimal point), 
    //and return its length + 1 (we add +1 to account for the digit before the decimal place)
    if (numStr.includes('.')) {
        return numStr.split('.')[1].length + 1;
    }
    //if the string doesn't have a decimal point, return 1, even though it technically has 0, as a whole number, but that breaks stuff so don't do that
    return 1;
}

//JavaScript is weird with floating-point math, this makes things nice and round for us.
function floatMathFix(num){
    //literally just take the input number, which is prob weird like 0.30000000000000000000000000004 or smth, and use toFixed() to cut off everything after digit 9
    num = num.toFixed(9);
    //turn it back into a number (toFixed() turns its input into a string.. I think. I don't actually remember)
    num = Number(num);
    //return the numberized number that is the round version of the num number we numbered into the number-fixer function
    return num;
}

//Super helpful function for finding the parent directory of any folder, because the parent ID is always one decimal shorter
//For example, 1.1 is the parent of all folders between 1.11 and 1.19
function truncate(num){
    //stringify the input (which is not always a number but I kept the name as "num" because I originally made it to truncate directories)
    num = num.toString();
    //initialize an empty array, we'll use this in a fwe lines
    chars = [];
    //loop through the stringified input, add each character to the chars[] array
    for (let index = 0; index < num.length; index++) {
        const char = num[index];
        chars.push(char);
    }
    //once all the characters are inside chars[], we remove the last value
    chars.pop();
    //we then re-stringify the result
    num = chars.toString();
    //and then take out the commas, which are generated by default when turning an array into a string, to separate the different array values
    num = num.replaceAll(",", "")
    //return the shortened input
    return num;
}

//The dirCodes map keeps track of what directories we've created
dirCodes = new Map();

//The paths map keeps track of the names of the directories we create
paths = new Map();

//Change the source folder name here :)
paths.set(0, "<C:\\root>")

//The files map holds the keyword(s) of our files as keys, and sets their values to their place in fileArray[]
files = new Map();  
//files2 holds the name and content of our files
files2 = new Map();
//filesArray is actually a 2d array, each value holds two other values, the name and parent directory of the file.
fileArray = [];

//makeFile() creates files as declared in populate()
//these files will automatically be viewable and accesible on the user's end
function makeFile(code, name, folder, content){

    //first, we take our name and targeted parent folder, and put them at the end of our fileArray[]
    fileArray.splice(fileArray.length, 0, [name, folder])

    //then, we check if there are multiple keywords given to us when called
    if(Array.isArray(code)){
        //if there are, we add each one to our files maps
        code.forEach(element => {
            element = element.toUpperCase();
            files.set(element, fileArray[fileArray.length-1])
            files2.set(files.get(element)[0], content)
        });
        //end the function early if it is an array and we finish the loop
        return;
    }

    //get rid of case sensitivity
    code = code.toUpperCase();
    //set a new files pair with the key as the code, and the value being the name+folder pair we added at the start of the function
    files.set(code, fileArray[fileArray.length-1])
    //we then set a new files2 pair with the key being the name, provided from fileArray[], and the value being the content we want to display.
    files2.set(files.get(code)[0], content)
}

//makeFolder() creates folders as declared in populate()
function makeFolder(name, dirID){
    //get rid of case sensitivity and add the unified-case name to the directory database, pointing to the new dirID
    dirCodes.set(name.toLowerCase(), dirID)
    //grab the parent directory ID of the folder we want to make
    pID = truncate(dirID);
    //if the truncated value is an empty string, set it to 0, to keep things numerical, yk?
    if(pID == ""){
        pID = 0;
    }
    //otherwise, re-numberize the pID
    else {
        pID = Number(pID);
    }
    //take the name as given, and append it to the path of its parents
    name = paths.get(pID).split(">")[0]+"\\"+name+">";
    //lastly, create a new paths pair, with a key of the directory ID, and the new, long name.
    paths.set(dirID, name);
}


//Populate runs as soon as the html loads, 
function populate(){

    //makeFile("", "", 0, "")
    //makeFolder("", 0)

    //makeFile("keyword(s)", "display_name", <parent directory#>, "file_content")
    //makeFolder("name", <directory#>)

    //Folder creation:
        //First argument -> The name of the folder, I recommend that you replace spaces with (_), (-), or (.)
        //Second argument -> The directory ID, this can be any number with digits n + 1 within numbers 1-9, ex. x->x.y->x.yz
        //Digits can be the same, or different, as their parent digit, ex. 1.11 is just as valid as 1.23

    //File creation:
        //First argument -> The keywords(s) of the file, use "keyword" for one keyword, use ["key1", "key2"] for multiple keywords
        //Second argument -> The display name of the file, can be any string, I recommend putting file extensions at the end,
        //I like to use fake ones, like ".arc" for an "archive" file, or ".org" for a file about a certain organization
        //Third argument -> The directory ID of the folder you want the file to reside in, 0 for the root folder
        //Fourth argument -> The content of the file, I can only guarantee that strings will work properly, anything else will need to be tested

    //Examples:
        //I like to use indents to make my code more easily readable :)
        //This will show up in the <list> command result as <E:\root\Sub1>
        makeFolder("Sub1", 1)
            //This will show up in the result of <list> as <E:\root\Sub1\file1.txt>
            //This file can only be accessed via using the command <access file1> (not case-sensitive) while in the Sub1 directory
            makeFile("File1", "file1.txt", 1, "This is an example file")
            //This is a subfolder of the Sub1 directory, it will only show up when the user is in the Sub1 folder
            makeFolder("Sub1.1", 1.1)
                makeFile("longFile", "longFile.txt", 1.1, "This is an example of a a long string of text being wrapped to the max characters as specified in <help> code comments:\nSome variation of this \"lines... for(...lines.length)...\" is in every command. Basically, for some reason, if your input string is too long when using this.echo, it will automatically break the line, as it should, but then it starts re-printing the first line, until it finishes or moves to the next line, in which case the line magically corrects itself, and the next line starts re-printing the first one... Do I know why this happens? Nope. Am I going to bang my head against a wall trying to find a perfect solution for it? Also no.")
                makeFolder("Sub1.11", 1.11)
                    makeFolder("Sub1.111", 1.111)
                        makeFolder("Sub1.1111", 1.1111)
                        makeFile("deep", "deep.txt", 1.1111, "You can make folders deeper than this, but I'm too lazy for that.")
        //This will show up in the <list> command result as <E:\root\Sub 2>
        //However, this folder can only be accessed if the [folder] of <dir [folder]> is in quotation marks: ["folder"]
        makeFolder("Sub 2", 2)
            //This file will show up in the result of <list> as <E:\root\Sub 2\file2.txt>
            //This file can only be accessed via using the command <access "file 2"> (not case-sensitive) while in the "Sub 2" directory
            makeFile("File 2", "file2.txt", 2, "This is example file 2")
        makeFolder("Sub3", 3)
            //This file demonstrates how you can have multiple keywords for a single file, this is good for accessibility :)
            makeFile(["file3", "file_3", "file 3", "file-3", "file.3", "file3.txt"], "file3.txt", 3, "This is an example file that can be accessed with multiple keywords, try using <access [file3 OR file_3 OR \"file 3\" OR file-3 OR file.3 OR file3.txt]> and see how the same file is accessed!")
}

document.addEventListener("DOMContentLoaded", populate)



//this is where all of our terminal commands are held. These define what happens when a user enters certain text into the input box.
$('body').terminal({

    //This variable is VERY IMPORTANT - it tracks what directory you are currently in! It can have, theoretically (I haven't tested), 14-16 digits after the decimal point. 
    //The first digit must be 1-9, and cannot exceed this range.
    //For example, the highest this number can go before things will probably start breaking is 9.9999999999999999.
    //However, this theoretically gives you 9^17 / 16,677,181,699,666,569 / 16.7 quadrillion possible folders, 
    //which is 994,037,491.063 times the maximum amount of files this system can hold (2^24 / 16,777,216 / 16.8 million).
    //In practice, though, the floatMathFix() function caps decimal places at 9, due to weird JavaScript "0.1 + 0.2 = 0.300000000004" type stuff :(
    double: dir = 0,

    //The <help> command is pretty straightforward, it prints out a list of commands you can run :)
    //If you add more commands, you should probably add them here
    help: async function(){

        helpStr = ">> dir [folder] - choose directory to browse \n>> access [file] - choose file to open \n>> list - lists available files and folders in the current directory \n>> back - returns you to the previous directory \n>> home - returns you to the root directory \n>> current - prints the current directory path"



        /*
        Some variation of this "lines... for(...lines.length)..." is in a few commands.
        Basically, for some reason, if your input string is too long when using this.echo, it will automatically break the line, as it should, but then it starts re-printing the first line,
        until it finishes or moves to the next line, in which case the line magically corrects itself, and the next line starts re-printing the first one...
        Do I know why this happens? Nope. Am I going to bang my head against a wall trying to find a perfect solution for it? Also no.
        Regardless, this is a roundabout way of solving that problem. If you're smarter than me (not a difficult thing to be) I encourage you to find a better one lmao
        I'll explain here how each part works, and what it does, and I'll mark the rest of them with a comment that says:
        
        "//PRINTER -> See comments on the <help> code"
        
        First, we create a new variable, "lines", and we set it to $.terminal.split_equal(inputString, maxChars, I can't remember what the "true" argument is for but I'm scared to remove it)
        This "lines" will now be our input string, in this case our list of help commands, split into an array of strings, with 125 maximum characters each.
        If you're designing your terminal to be displayed on a thinner screen, I recommend putting the maxChars at a value slightly less than what can be displayed on your target screen. 
        Right now it's set up for standard ~16:9 aspect ratios, so adjust as needed :) 
        */
        lines = $.terminal.split_equal(helpStr, 125, true);
        //We then loop through "lines" and use this.echo(element, {typing: true, delay:delay}) to print it out
        for (let index = 0; index < lines.length; index++) {
            //"element" is the value of "lines" at the current loop index, this becomes the string we want to print out before we move on to the next one.
            const element = lines[index];
            //We now print out our "element" string, with the typing feature enabled, and a delay between characters of 25ms. 
            //You can change the delay or even turn off typing if you want, though I recommend creating a global variable so you don't have to change them all individually
            await this.echo(element, {typing:true, delay:25});
            //Now, before we go to the next line, we wait for the same delay as the typing delay, so that it takes as much time to go from the last character to the next line instead of jumping immediately.
            //You can increase this delay to make the terminal pause between printing lines
            await new Promise(resolve => setTimeout(resolve, 25));
            //Now we end the loop and do it all over again until we've printed everything we want to :D
        }
    },


    //<current> is so simple it doesn't need a PRINTER, it justs prints out the current directory :)
    //If your directory paths are so long that they overflow into the next line, you might want to reconsider how organized your project is...
    //Otherwise, just copy and paste a PRINTER into here and make "lines" the directory path
    current: async function(){
        await this.echo(">> The current directory is: " + paths.get(dir), {typing:true, delay:25});
    },


    //<dir> was a pain to figure out. I'll try my best to explain it as simply as possible :)
    dir: async function(code){
        //First, we unify the case, to make it so that <dir [folder]>, <dir [Folder]>, and <dir [FOLDER]> all do the same thing.
        //This does mean you can't have duplicate file names, but that's pretty normal with any real file manager (File Explorer my beloathed </3)
        code = code.toLowerCase();

        //We'll be modifying the dir variable in here, but in case the code isn't valid, we need to make sure we save the starting directory
        startDir = dir;

        //pDir will be used to store the directory ID of the parent of the target folder.
        pDir = 0;

        //Now, we invoke the .get method on our dirCodes dictionary, which is defined near the top of the code, below the greeting
        //If the code the user puts in returns a directory that exists, we continue the code
        if(dirCodes.get(code)!=undefined){
            //Because we've only confirmed that the target directory exists, and not whether or not it's accesible, we find the parent directory's ID
            pDir = truncate(dirCodes.get(code));
            //We then compare it to the user's current directory ID
            //If they're the same, we know the target directory both exists and is accessible from the current directory
            if(dir == pDir){
                //Thus, having confirmed the necessary requirements, we set our current directory to target directory.
                dir = dirCodes.get(code);
            }
        }
        
        //If the code didn't return a valid target directory ID, or if the user's current directory is not the parent directory of the target,
        //the user's current directory will be unchanged. As such, we print a "not found" message encouraging the user to use <list>, and then we return to end the function.
        if(dir == startDir){
            await this.echo(">> Directory " + truncate(paths.get(dir)) + "\\" + code + "> not found, use command <list> to see all available directories", {typing:true, delay:25})
            return;
        }

        //If the directory did change, we can finish the function with a print of the new current directory
        //As with the <help> function, if your directory paths are so long that they overflow into the next line, you might want to reconsider how organized your project is...
        //Otherwise, just copy and paste a PRINTER into here and make "lines" the directory path
        await this.echo(">> Now in directory: " + paths.get(dir), {typing:true, delay:25})
    },

    home: async function(){
        if(dir != 0){
            dir = 0;
            await this.echo(">> You are now in <E:\\root>", {typing:true, delay:25});
            return;
        }
        await this.echo(">> You are already in <E:\\root>", {typing:true, delay:25})
    },

    back: async function(){
        if(dir == 0){
            await this.echo(">> You are already in the highest-level directory", {typing:true, delay:25});
            return;
        }
        
        dir = Number(truncate(dir));

        await this.echo(">> Now in directory: " + paths.get(dir), {typing:true, delay:25});
    },

    list: async function(){
         str = "";

         dirArray = [...paths.keys()];

         folderNum = 0;

         rootFolderNum = 0;

         fileNum = 0;
        
        for (let index = 0; index < dirArray.length; index++) {
            const element = dirArray[index];
            if(dir != 0){
                i = 1;
                while(i < 10){
                nDir = floatMathFix(dir + (i/(10**countDecimalPlaces(dir))));
                if(nDir == element){
                    folderNum++;
                }
                i++;
                }
            }
            else{
                k = 1;
                while(k < 100){
                    if(k == element){
                        rootFolderNum++;
                    }
                    k++;
                }
            }
            
        }
         dirs = []
        
        for (let index = 0; index < fileArray.length; index++) {
            const element = fileArray[index];
            if(dir == element[1]){
                fileNum++;
            }
        }

  

        if(dir == 0){
            str = ">> " + paths.get(dir) + " has " + rootFolderNum + " folders and " + fileNum + " files";
        }
        else{
            str = ">> " + paths.get(dir) + " has " + folderNum + " folders and " + fileNum + " files";
        }

        for (let index = 1; index < 10; index++) {
            if(dir != 0){
                nDir = floatMathFix(dir + (index/(10**countDecimalPlaces(dir))));
                //str += ("\n testing nDir " + nDir)
                if(paths.get(nDir)!=undefined){
                nStr = paths.get(nDir).split("\\")
                    str += ("\n>>> <\\" + nStr[nStr.length-1])
                }
            }
            else{
                //str += ("\n testing nDir " + index)
                if(paths.get(index)!=undefined){
                    nStr = paths.get(index).split("\\")
                    str += ("\n>>> <\\" + nStr[nStr.length-1])
                }
            }    
        }

        for (let index = 0; index < fileArray.length; index++) {
            const element = fileArray[index];
            if(dir == element[1]){
                str += ("\n>>> " + element[0])
            }
        }
         lines = $.terminal.split_equal(str, 125, true);
            for (let index = 0; index < lines.length; index++) {
                const element = lines[index];
                await this.echo(element, {typing:true, delay:25});
                await new Promise(resolve => setTimeout(resolve, 25));
            }
        await this.echo(">>")
        return;
    },

    access: async function(code) {
        code = code.toUpperCase();
        
        if(files.get(code)!=undefined && dir == files.get(code)[1]){
            str = (">> File: " + truncate(paths.get(dir)) + "\\" + files.get(code)[0] + ">\n>>");
            await this.echo(str, {typing:true, delay:25});
            lines = $.terminal.split_equal(files2.get(files.get(code)[0]), 125, true);
            for (let index = 0; index < lines.length; index++) {
                const element = lines[index];
                await this.echo(">>> " + element, {typing:true, delay:25});
                await new Promise(resolve => setTimeout(resolve, 25));
            }
            await this.echo(">>")
        }
        else {
            await this.echo(">> Could not find file "  + truncate(paths.get(dir)) + "\\" + code + ">    ", {typing:true, delay:25})
            return;
        }
    },
}, {
    greetings: greetings.innerHTML
});
</script>
